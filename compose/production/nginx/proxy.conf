# Used by docker-compose.ip.yml: nginx is the public entry point (no Traefik/TLS),
# proxies the app to gunicorn/uvicorn and serves uploaded media directly.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  # Resolve "django" through Docker's DNS on every request (cached 10s) instead of
  # once at startup: a redeploy recreates the django container with a new IP,
  # and a statically resolved upstream would keep pointing at the old one (502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $django_upstream http://django:5000;

  # Launcher builds and MCP uploads can be large (MCP_MAX_UPLOAD_BYTES = 512 MB).
  client_max_body_size 600m;

  location /media/ {
    alias /usr/share/nginx/media/;
    access_log off;
    expires 7d;
  }

  location / {
    proxy_pass $django_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }
}
