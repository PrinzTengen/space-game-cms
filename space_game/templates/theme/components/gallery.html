{% load cms_tags i18n %}

<section class="space-section space-gallery container"
         data-gallery
         {% if request.toolbar.edit_mode_active %}data-gallery-edit-mode{% endif %}
         data-gallery-image-label="{% translate 'Show image' %}"
         data-gallery-slide-label="{% translate 'Image' %}"
         data-gallery-fullscreen-label="{% translate 'Enter fullscreen' %}"
         data-gallery-exit-fullscreen-label="{% translate 'Exit fullscreen' %}"
         role="region"
         aria-roledescription="{% translate 'carousel' %}"
         aria-labelledby="gallery-title-{{ instance.pk }}">
  <div class="gallery-heading">
    <div>
      {% if instance.eyebrow %}<p class="eyebrow">{{ instance.eyebrow }}</p>{% endif %}
      <h2 id="gallery-title-{{ instance.pk }}" class="section-heading mb-0">{{ instance.title }}</h2>
      {% if instance.description %}<p class="text-body-secondary mt-3 mb-0">{{ instance.description }}</p>{% endif %}
    </div>
  </div>
  <div id="gallery-viewer-{{ instance.pk }}"
       class="gallery-viewer"
       data-gallery-viewer>
    <div class="gallery-stage">
      <div id="gallery-track-{{ instance.pk }}"
           class="gallery-track"
           data-gallery-track
           tabindex="0"
           role="group"
           aria-labelledby="gallery-title-{{ instance.pk }}">
        {% for image in instance.child_plugin_instances %}
          {% render_plugin image %}
        {% endfor %}
      </div>
      <div class="gallery-controls" data-gallery-controls hidden>
        <button type="button"
                class="gallery-arrow gallery-arrow-prev"
                data-gallery-prev
                aria-label="{% translate 'Previous image' %}"
                aria-controls="gallery-track-{{ instance.pk }}">
          <span aria-hidden="true">←</span>
        </button>
        <button type="button"
                class="gallery-arrow gallery-arrow-next"
                data-gallery-next
                aria-label="{% translate 'Next image' %}"
                aria-controls="gallery-track-{{ instance.pk }}">
          <span aria-hidden="true">→</span>
        </button>
      </div>
      <span class="gallery-count" data-gallery-count aria-hidden="true" hidden></span>
      <button type="button"
              class="gallery-fullscreen"
              data-gallery-fullscreen
              aria-label="{% translate 'Enter fullscreen' %}"
              aria-controls="gallery-viewer-{{ instance.pk }}"
              aria-pressed="false"
              hidden>
        <svg class="gallery-icon-expand"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5"
             aria-hidden="true"
             focusable="false">
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
        </svg>
        <svg class="gallery-icon-close"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5"
             aria-hidden="true"
             focusable="false">
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </button>
    </div>
    <div class="gallery-sidebar" data-gallery-sidebar hidden>
      <div class="gallery-thumbnails"
           data-gallery-thumbnails
           role="group"
           aria-label="{% translate 'Choose an image' %}"
           hidden></div>
    </div>
  </div>
  <dialog class="gallery-dialog"
          data-gallery-dialog
          aria-labelledby="gallery-title-{{ instance.pk }}"></dialog>
  <p class="visually-hidden"
     role="status"
     aria-atomic="true"
     data-gallery-status></p>
</section>
