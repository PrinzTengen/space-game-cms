{% load menu_tags %}

{% for child in children %}
  <li class="nav-item{% if child.selected %} active{% endif %}">
    <a class="nav-link{% if child.selected %} active{% endif %}"
       href="{{ child.attr.redirect_url|default:child.get_absolute_url }}"
       {% if child.selected %}aria-current="page"{% endif %}>{{ child.get_menu_title }}</a>
    {% if child.children %}
      <ul class="navbar-nav ms-3">
        {% show_menu from_level to_level extra_inactive extra_active template "" "" child %}
      </ul>
    {% endif %}
  </li>
{% endfor %}
