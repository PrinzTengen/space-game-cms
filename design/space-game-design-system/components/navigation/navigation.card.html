<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const NS = await window.getSpaceGameDS("../../");
const { Navbar, Segment, Button, UserChip, Brand } = NS;
function Demo() {
  const [lang, setLang] = React.useState('de'); const [f, setF] = React.useState('all'); const [p, setP] = React.useState(0);
  const items = ['Start','Logbuch','Download','System & FAQ'].map((l,i)=>({label:l,active:p===i,onClick:()=>setP(i)}));
  return (
  <div style={{display:'flex',flexDirection:'column',gap:18,margin:-20}}>
    <Navbar sticky={false} badge="Pre-Alpha" items={items} right={<><Segment bare size="sm" value={lang} onChange={setLang} options={[{value:'de',label:'DE'},{value:'en',label:'EN'}]} /><Button size="sm" caps>Anmelden</Button></>} />
    <div style={{display:'flex',gap:18,alignItems:'center',flexWrap:'wrap',padding:'0 20px'}}>
      <Segment label="Filter" value={f} onChange={setF} options={[{value:'all',label:'Alle',count:5},{value:'news',label:'News',count:2},{value:'devlog',label:'Devlogs',count:3}]} />
      <UserChip initials="NK" handle="@nova_kepler" />
      <Brand badge="Pre-Alpha" />
    </div>
  </div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
})();
</script></body></html>
