<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-line);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Trenner</div><div style="font-size:11px;color:var(--sg-dim)">--sg-line<br>#17262c</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-border-soft);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Rand</div><div style="font-size:11px;color:var(--sg-dim)">--sg-border-soft<br>#5a7c81 / .6</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-border);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Rand voll</div><div style="font-size:11px;color:var(--sg-dim)">--sg-border<br>#5a7c81</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-border-lift);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Rand Hover</div><div style="font-size:11px;color:var(--sg-dim)">--sg-border-lift<br>#fff / .22</div></div></div>
</body></html>
