<!-- @dsCard group="Colors" viewport="700x170" name="Akzent" subtitle="Die einzige Auszeichnungsfarbe" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-accent);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Akzent</div><div style="font-size:11px;color:var(--sg-dim)">--sg-accent<br>#8be0ec</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-accent-hover);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Akzent Hover</div><div style="font-size:11px;color:var(--sg-dim)">--sg-accent-hover<br>#a9ecf5</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-accent-pressed);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Akzent Pressed</div><div style="font-size:11px;color:var(--sg-dim)">--sg-accent-pressed<br>#6fc6d3</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-accent-line);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Akzent-Linie</div><div style="font-size:11px;color:var(--sg-dim)">--sg-accent-line<br>.55</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-on-accent);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Auf Akzent</div><div style="font-size:11px;color:var(--sg-dim)">--sg-on-accent<br>#031418</div></div></div><p style="margin:14px 0 0;font-size:12px;color:var(--sg-dim)">Für Links, Eckwinkel, aktive Zustände, Pfeile, Fokus. Nie als großflächige Füllung.</p>
</body></html>
