<!-- @dsCard group="Colors" viewport="700x150" name="Signal" subtitle="Nur mit Bedeutung: Warnung, Gefahr, Erfolg" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-warn);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Warnung</div><div style="font-size:11px;color:var(--sg-dim)">--sg-warn<br>#ffab26</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-danger);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Gefahr</div><div style="font-size:11px;color:var(--sg-dim)">--sg-danger<br>#fc3624</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-good);border:1px solid var(--sg-border-soft);box-shadow:var(--sg-glow-good)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Erfolg</div><div style="font-size:11px;color:var(--sg-dim)">--sg-good<br>#50f883</div></div></div>
</body></html>
