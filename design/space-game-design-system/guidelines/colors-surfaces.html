<!-- @dsCard group="Colors" viewport="700x150" name="Flächen" subtitle="Grund, Panel, Bedienflächen – alle kühl, fast schwarz" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-bg);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Grund</div><div style="font-size:11px;color:var(--sg-dim)">--sg-bg<br>#040a0e</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-panel);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Panel</div><div style="font-size:11px;color:var(--sg-dim)">--sg-panel<br>#12181b</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-button);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Button</div><div style="font-size:11px;color:var(--sg-dim)">--sg-button<br>#0d242b</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-hover);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Hover</div><div style="font-size:11px;color:var(--sg-dim)">--sg-hover<br>#143d47</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-pressed);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Pressed</div><div style="font-size:11px;color:var(--sg-dim)">--sg-pressed<br>#1f5966</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--sg-media);border:1px solid var(--sg-border-soft)"></div><div style="font-size:11px;color:var(--sg-title);font-weight:600">Medien</div><div style="font-size:11px;color:var(--sg-dim)">--sg-media </body></html>
