<!-- @dsCard group="Effects" viewport="700x170" name="Schatten & Glühen" subtitle="Sparsam; Glühen nur Akzent oder Erfolg" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--sg-bg)}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px">
 <div><div style="height:64px;background:var(--sg-button);box-shadow:var(--sg-shadow)"></div><div style="font-size:11px;color:var(--sg-dim);margin-top:8px">--sg-shadow</div></div>
 <div><div style="height:64px;background:hsl(187 35% 8%);box-shadow:var(--sg-glow)"></div><div style="font-size:11px;color:var(--sg-dim);margin-top:8px">--sg-glow</div></div>
 <div><div style="height:64px;background:var(--sg-media);box-shadow:var(--sg-media-vignette)"></div><div style="font-size:11px;color:var(--sg-dim);margin-top:8px">--sg-media-vignette</div></div>
 <div><div style="height:64px;background:var(--sg-inset);border:1px solid var(--sg-border-soft);box-shadow:var(--sg-inset-well)"></div><div style="font-size:11px;color:var(--sg-dim);margin-top:8px">--sg-inset-well</div></div></div>
</body></html>
