services:
  docs:
    image: space_game_local_docs
    container_name: space_game_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - path: ./.envs/.local/.django
        required: false
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./space_game:/app/space_game:z
    ports:
      - '9000:9000'
    command: /start-docs
