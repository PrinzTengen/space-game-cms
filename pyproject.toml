[project]
name = "space_game"
version = "0.1.0"
description = "website"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Nölp Max", email = "space-game@mail.gg" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.7.0",
  "crispy-bootstrap5==2026.9",
  "django==6.0.10",
  "django-allauth[mfa]==65.21.1",
  "django-anymail[mailgun]==15.2",
  "django-celery-beat==2.9.0",
  "django-cms==5.1.3",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-filer>=3.6.0",
  "django-meta>=2.5.1",
  "django-model-utils==5.0.0",
  "django-oauth-toolkit==3.4.1",
  "django-parler>=2.4",
  "django-ratelimit==4.1.0",
  "django-redis==7.0.0",
  "django-sekizai>=4.1.0",
  "django-sortedm2m>=4.1.0",
  "django-taggit>=7.0.0",
  "djangocms-cookie-love==0.1.1",
  "djangocms-frontend==2.5.3",
  "djangocms-link>=5.2.0",
  "djangocms-stories==0.9.3",
  "djangocms-text==1.0.2",
  "djangocms-transfer==2.0.1",
  "djangocms-versioning==2.8.0",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "easy-thumbnails>=2.10.1",
  "flower==2.2.0",
  "gunicorn==27.0.0",
  "hiredis==3.5.0",
  "mcp==2.3.0",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.8; sys_platform == 'win32'",
  "psycopg[c]==3.3.8; sys_platform != 'win32'",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "sentry-sdk==2.74.0",
  "uvicorn-worker==0.4.0",
  "uvicorn[standard]==0.54.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.17.2",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangorestframework-stubs==3.18.2",
  "djlint==1.49.9",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.4",
  "sphinx==9.2.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.3.0",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
markers = ["real_mfa: use the actual staff MFA authentication flow"]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "space_game/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
