# Override for deployments reached via http://<server-ip>:<APP_PORT> without a domain.
# Usage: docker compose -f docker-compose.production.yml -f docker-compose.ip.yml up -d
# Traefik (Let's Encrypt needs a domain) and Flower are switched off via profiles;
# nginx becomes the public reverse proxy.
services:
  traefik:
    profiles: ["domain"]

  flower:
    profiles: ["flower"]

  django:
    restart: unless-stopped

  celeryworker:
    restart: unless-stopped

  celerybeat:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:80"
    volumes:
      - ./compose/production/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
